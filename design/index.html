*{box-sizing:border-box}

/* 1 Hevy — чёрный, плоские серые карточки программ, синяя кнопка внутри каждой */

/* 3 Fitbod — угольный, список упражнений с плитками-миниатюрами, красная плавающая кнопка */

/* 4 JEFIT — тёмно-синий, полоса недели сверху, карточка плана с баннером */

.v5 .hero small{font-size:12px;font-weight:600;letter-spacing:.02em;position:relative}.v5 .hero b{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:4px 0;position:relative}

.v9 .w{display:flex;align-items:center;gap:12px}.v9 .w i{width:44px;height:44px;border-radius:50%;background:#2b3a12;color:#a6ff00;display:grid;place-items:center}
.v9 .w div{margin-right:auto}.v9 .w b{font-size:19px;font-weight:700;color:#a6ff00;display:block}.v9 .w span{font-size:13px;color:#8e8e93}
.v9 .w button{background:#a6ff00;color:#000;height:40px;padding:0 20px;border-radius:20px;font-weight:700}
.v9 .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.v9 .two .c{margin:0}.v9 .two b{font-size:26px;font-weight:700;display:block}.v9 .two b span{font-size:15px}.v9 .two small{font-size:13px;color:#8e8e93}
.v9 .nav{background:rgba(22,22,24,.94);border-top:1px solid #2a2a2c;color:#8e8e93}.v9 .nav .on{color:#a6ff00}

/* 10 WHOOP — сине-чёрный градиент, тонкие шкалы-кольца, узкий капс, плотные данные */
.v10{background:linear-gradient(180deg,#283339 0%,#101518 46%);color:#fff}.v10 .p{padding:4px 16px}
.v10 .d{font-family:"DIN Condensed","DIN Alternate","Helvetica Neue",sans-serif;text-transform:uppercase;letter-spacing:.06em}
.v10 .hd{display:flex;justify-content:center;align-items:center;gap:18px;height:44px;font-size:20px;font-weight:700}.v10 .hd svg{width:18px;height:18px;color:#8a979f}
.v10 .gs{display:flex;justify-content:space-between;margin:10px 2px 18px}.v10 .g{width:104px;text-align:center}.v10 .gw{position:relative;width:104px;height:104px}
.v10 .gw div{position:absolute;inset:0;display:grid;place-content:center}.v10 .gw b{font:700 32px/1 "DIN Alternate","Helvetica Neue",sans-serif}.v10 .gw b span{font-size:15px}
.v10 .g small{display:block;margin-top:8px;font-size:15px;font-weight:700;color:#c3ccd1}.v10 .g em{font-style:normal;font-size:12px;color:#8a979f;display:block;font-family:-apple-system,sans-serif;letter-spacing:0;text-transform:none}
.v10 .c{background:#1a2227;border-radius:10px;margin-bottom:10px}.v10 .c h3{font-size:15px;font-weight:700;color:#8a979f;padding:12px 14px 4px}
.v10 .c .x{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid #263138;font-size:15px}.v10 .c .x:nth-child(2){border:0}
.v10 .c .x i{width:8px;height:8px;border-radius:50%;flex:none}.v10 .c .x b{font-weight:600;margin-right:auto}.v10 .c .x span{color:#c3ccd1;font:600 15px "DIN Alternate","Helvetica Neue",sans-serif}.v10 .c .x svg{width:16px;height:16px;color:#5b6870}
.v10 .t{padding:4px 14px 10px}.v10 .t div{display:flex;justify-content:space-between;font-size:16px;padding:5px 0;color:#c3ccd1}.v10 .t span{color:#fff}
.v10 .go{width:100%;height:50px;border-radius:8px;background:#fff;color:#101518;font-size:18px;font-weight:700}
.v10 .nav{background:#101518;border-top:1px solid #1f282d;color:#5b6870}.v10 .nav .on{color:#fff}
</style>
</head>
<body>
<div class="wall" id="wall"></div>
<script>
// Одни данные на все 10 макетов: суббота, третья тренировка недели (вт A, чт B, сб A).
const D = { day: 'A', dow: 'Суббота', date: '10 октября', n: 7, sets: 16, min: 55, week: 2, goal: 3, streak: 4, kcal: 1840, kcalGoal: 3050, prot: 96, protGoal: 150, weight: 82.5, ton: '8,0',
  ex: [['Присед', 3, '6–8', 80], ['Жим лёжа', 3, '6–8', 62.5], ['Тяга горизонтальная', 3, '8–12', 55], ['Сгибание ног сидя', 2, '10–15', 40], ['Трицепс над головой', 2, '10–15', 22.5], ['Икры стоя', 2, '10–15', 60], ['Махи в стороны', 2, '12–20', 8]],
  exB: ['Румынская тяга', 'Жим стоя', 'Верхний блок', 'Жим ногами', 'Сгибания на бицепс', 'Махи в стороны', 'Скручивания на блоке'] };
const kg = (n) => String(n).replace('.', ','), sp = (n) => String(n).replace(/\B(?=(\d{3})+$)/g, ' ');
const P = { gym: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>', hist: '<path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 7v5l3 2"/>', food: '<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 2-3 5s1 4 3 4v9"/>',
  me: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', chev: '<path d="M9 6l6 6-6 6"/>', back: '<path d="M15 6l-6 6 6 6"/>', plus: '<path d="M12 5v14M5 12h14"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  list: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', flame: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>', flag: '<path d="M5 21V4h12l-2 4 2 4H5"/>' };
const I = (n) => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const nav = () => `<nav class="nav">${[['gym', 'Сегодня'], ['hist', 'История'], ['food', 'Питание'], ['me', 'Я']].map(([i, t], k) => `<b class="${k ? '' : 'on'}">${I(i)}${t}</b>`).join('')}</nav>`;
const ring = (s, r, w, p, c, t) => { const C = 2 * Math.PI * r, m = s / 2; return `<circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${t}" stroke-width="${w}"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C * p} ${C}" transform="rotate(-90 ${m} ${m})"/>`; };
const names = D.ex.map((e) => e[0]), wk = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'], done = [1, 3], today = 5;
const pW = D.week / D.goal, pP = D.prot / D.protGoal, pK = D.kcal / D.kcalGoal;

const V = [
['Hevy', 'чёрный · программы карточками · синяя кнопка в каждой', () => `<div class="hd">Тренировка</div><div class="p">
  <h3>Быстрый старт</h3><button class="g">${I('plus')}Начать пустую тренировку</button>
  <div class="rw"><h3>Программы</h3></div><div class="two"><button class="g">${I('list')}Новая</button><button class="g">${I('search')}Обзор</button></div>
  <div class="fold">▾ Мои программы (2)</div>
  <div class="c"><div class="rw"><b>Тренировка A</b><em>сегодня</em><s>•••</s></div><p>${names.join(', ')}</p><button class="bl">Начать программу</button></div>
  <div class="c"><div class="rw"><b>Тренировка B</b><s>•••</s></div><p>${D.exB.join(', ')}</p><button class="bl">Начать программу</button></div></div>`],
['Strong', 'белый · крупный заголовок · шаблоны сеткой 2×', () => `<div class="p"><h1>Начать тренировку</h1><h4>БЫСТРЫЙ СТАРТ</h4><button class="bl">Начать пустую тренировку</button>
  <div class="rw"><h2>Шаблоны</h2><span class="pill">+ Шаблон</span><span class="pill">•••</span></div><h4>МОИ ШАБЛОНЫ (2)</h4>
  <div class="grid"><div class="c on"><b>Тренировка A <span>•••</span></b><p>${D.ex.map((e) => e[1] + ' × ' + e[0]).join(', ')}</p><small>${I('clock')}сегодня по плану</small></div>
  <div class="c"><b>Тренировка B <span>•••</span></b><p>${D.exB.map((e, i) => (i < 3 ? 3 : 2) + ' × ' + e).join(', ')}</p><small>${I('clock')}2 дня назад</small></div></div>
  <h4>ЭТА НЕДЕЛЯ</h4><div class="wk rw"><b>${D.week} из ${D.goal} тренировок</b><span>вт · чт · сб</span></div></div>`],
['Fitbod', 'угольный · список упражнений с плитками · красная кнопка внизу', () => `<div class="p"><div class="day">${D.dow}, ${D.date}</div><h1>Тренировка A</h1>
  <div class="chips"><span>${D.min} мин</span><span>${D.n} упражнений</span><span>${D.sets} подходов</span></div>
  <div class="chips m"><span>Ноги</span><span>Грудь</span><span>Спина</span><span>Плечи</span></div>
  ${D.ex.map((e, i) => `<div class="e ${[2, 4, 6].includes(i) ? 'ss' : ''}"><div class="t">${i + 1}</div><div><b>${e[0]}</b><small>${e[1]} подх. · ${e[2]} повт. · ${kg(e[3])} кг</small></div><s>•••</s></div>`).join('')}</div>
  <div class="fade"></div><button class="go">Начать тренировку</button>`],
['JEFIT', 'тёмно-синий · полоса недели · карточка плана с баннером', () => `<div class="p"><div class="hi"><span>${D.dow}, ${D.date}</span>Привет, Денис</div>
  <div class="wk">${wk.map((d, i) => `<div class="${done.includes(i) ? 'd' : i === today ? 't' : ''}">${d}<i>${done.includes(i) ? '✓' : 5 + i}</i></div>`).join('')}</div>
  <div class="plan"><div class="ban"><small>ПЛАН · ДЕНЬ 3 ИЗ 3</small><b>Тренировка A</b></div><div class="pb"><span>${D.n} упражнений · ${D.min} мин</span><button>Начать</button></div></div>
  <div class="tiles"><div><b>${D.week}/${D.goal}</b><span>на этой неделе</span><div class="bar"><i style="width:${pW * 100}%"></i></div></div><div><b>${D.streak} нед.</b><span>серия без пропусков</span><div class="bar"><i style="width:100%"></i></div></div></div>
  <div class="l">${D.ex.slice(0, 4).map((e, i) => `<div><em>${i + 1}</em>${e[0]}<span>${e[1]}×${e[2]} · ${kg(e[3])} кг</span></div>`).join('')}</div></div>`],
['Nike Training Club', 'белый · гигантский узкий капс · чёрный блок-герой', () => `<div class="p"><div class="day">${D.dow}, ${D.date}</div><h1>Сегодня<br>зал</h1>
  <div class="hero"><small>Сила · Всё тело</small><b>Тренировка A</b><span>${D.min} мин · ${D.n} упражнений · ${D.week + 1}-я на неделе</span><button>Начать</button></div>
  <h2>Состав <span>Все ${D.n}</span></h2><div class="car">${D.ex.slice(0, 3).map((e, i) => `<div><em>0${i + 1}</em><b>${e[0]}<span>${e[1]}×${e[2]} · ${kg(e[3])} кг</span></b></div>`).join('')}</div></div>`],
['Peloton', 'чёрный · красный · серия недель · большая карточка занятия', () => `<div class="p"><div class="lab">${D.dow} · ${D.date}</div><h1>Готов к залу, Денис?</h1>
  <div class="st"><div class="rw"><b>${I('flame')}Серия ${D.streak} недели</b><span>${D.week} из ${D.goal} на этой</span></div><div class="dots">${wk.map((d, i) => `<i class="${done.includes(i) ? 'd' : i === today ? 't' : ''}">${d}</i>`).join('')}</div></div>
  <div class="cls"><div class="tags"><span>СИЛА</span><span>${D.min} МИН</span><span>${D.n} УПР.</span></div><b>Тренировка A</b><p>Присед · Жим лёжа · Тяга · ещё 4</p><button>НАЧАТЬ</button></div>
  <div class="lab">Дальше по программе</div><div class="nx"><div><span>Вт, 13 окт</span><b>Тренировка B</b></div><div><span>Чт, 15 окт</span><b>Тренировка A</b></div></div></div>`],
['Strava', 'светлая лента · оранжевый · тройки «подпись над цифрой»', () => `<div class="hd">Главная</div>
  <div class="b"><h3>Ваша неделя <span>Подробнее</span></h3><div class="trio"><div><small>Тренировки</small><b>${D.week} из ${D.goal}</b></div><div><small>Время</small><b>1 ч 47 мин</b></div><div><small>Тоннаж</small><b>14,2 т</b></div></div>
  <div class="bars">${wk.map((d, i) => `<div class="${i === today ? 't' : ''}"><i style="height:${i === 1 ? 76 : i === 3 ? 62 : i === today ? 70 : 0}%"></i></div>`).join('')}</div><div class="dw">${wk.map((d) => `<span>${d}</span>`).join('')}</div></div>
  <div class="b"><div class="who"><i>Д</i><div><b>Денис</b><span>Сегодня · по плану · зал</span></div></div><div class="ttl">Тренировка A</div>
  <div class="trio"><div><small>Упражнений</small><b>${D.n}</b></div><div><small>Время</small><b>~${D.min} мин</b></div><div><small>Тоннаж</small><b>~${D.ton} т</b></div></div>
  <div class="lifts">${D.ex.slice(0, 3).map((e) => `<div>${e[0]}<span>${e[1]}×${e[2]} · ${kg(e[3])} кг</span></div>`).join('')}</div><button class="go">Начать тренировку</button></div>
  <div class="b"><div class="who"><i>Д</i><div><b>Денис</b><span>Чт, 8 октября · 52 мин</span></div></div><div class="ttl">Тренировка B</div><div class="pr"><i>РЕКОРД</i>Румынская тяга 90 кг × 8</div></div>`],
['MyFitnessPal', 'светлый дашборд · синий · кольцо «Осталось» · еда на первом месте', () => `<div class="p"><div class="hd"><b>Сегодня</b><span>${D.dow}, ${D.date}</span></div>
  <div class="c"><h3>Калории</h3><small>Осталось = Цель − Еда</small><div class="kc"><div class="rg"><svg width="128" height="128">${ring(128, 56, 11, pK, '#0066ee', '#e4e7ec')}</svg><div><b>${sp(D.kcalGoal - D.kcal)}</b><span>осталось</span></div></div>
  <div class="ls"><div>${I('flag')}<span><small>Цель</small><b>${sp(D.kcalGoal)}</b></span></div><div>${I('food')}<span><small>Еда</small><b>${sp(D.kcal)}</b></span></div><div>${I('gym')}<span><small>Зал на неделе</small><b>${D.week} из ${D.goal}</b></span></div></div></div></div>
  <div class="two"><div class="c"><h3>Белок</h3><div class="num">${D.prot} <small>/ ${D.protGoal} г</small></div><div class="bar"><i style="width:${pP * 100}%"></i></div><div class="sub">ещё ${D.protGoal - D.prot} г</div></div>
  <div class="c"><h3>Вес</h3><div class="num">${kg(D.weight)} <small>кг</small></div><svg width="140" height="22" style="margin:4px 0 2px"><path d="M0 18 L23 16 L46 17 L70 12 L93 13 L116 8 L140 5" fill="none" stroke="#0066ee" stroke-width="2.5" stroke-linecap="round"/></svg><div class="up">+0,3 кг за неделю</div></div></div>
  <div class="c gym"><i>A</i><div><b>Тренировка A</b><span>${D.n} упражнений · ${D.min} мин</span></div><button>Начать</button></div>
  <div class="c gym" style="padding:12px 16px"><div><b>Креатин 5 г</b><span>сегодня не отмечен</span></div><button style="background:#e5efff;color:#0066ee">Отметить</button></div></div>`],
['Apple Fitness', 'чёрный · три кольца · цветные округлые цифры', () => `<div class="p"><div class="rw"><div><div class="dt">${D.dow}, 10 окт.</div><h1>Сводка</h1></div><div class="av">Д</div></div>
  <div class="c"><h3>Кольца дня ${I('chev')}</h3><div class="rings"><svg width="150" height="150">${ring(150, 64, 17, pW, '#fa114f', '#3a0d1a')}${ring(150, 45, 17, pP, '#a6ff00', '#273a05')}${ring(150, 26, 17, pK, '#00d8fe', '#06343d')}</svg>
  <div class="st r"><small>Зал</small><b class="pk">${D.week}/${D.goal}<span> ТРЕН.</span></b><small>Белок</small><b class="gr">${D.prot}/${D.protGoal}<span> Г</span></b><small>Калории</small><b class="cy">${sp(D.kcal)}<span> ККАЛ</span></b></div></div></div>
  <div class="c"><h3>Тренировка сегодня ${I('chev')}</h3><div class="w"><i>${I('gym')}</i><div><b class="r">Тренировка A</b><span>${D.n} упражнений · ~${D.min} мин</span></div><button>Начать</button></div></div>
  <div class="two"><div class="c"><h3>Вес</h3><b class="r" style="color:#bf5af2">${kg(D.weight)}<span> КГ</span></b><small>+0,3 кг за неделю</small></div><div class="c"><h3>Тоннаж</h3><b class="r" style="color:#ff9f0a">14,2<span> Т</span></b><small>за неделю, 2 трен.</small></div></div>
  <div class="c" style="margin-top:10px"><h3 style="margin:0">Креатин 5 г <span style="color:#8e8e93;font-weight:400">не отмечен</span></h3></div></div>`],
['WHOOP', 'сине-чёрный градиент · тонкие шкалы-кольца · узкий капс', () => `<div class="p"><div class="hd d">${I('back')}Сегодня${I('chev')}</div>
  <div class="gs">${[['Неделя', pW, '#16ec06', D.week + ' из ' + D.goal], ['Белок', pP, '#0093e7', D.prot + ' / ' + D.protGoal + ' г'], ['Калории', pK, '#ffde00', sp(D.kcal) + ' ккал']].map(([n, p, c, s]) => `<div class="g"><div class="gw"><svg width="104" height="104">${ring(104, 47, 6, p, c, '#2b363d')}</svg><div><b>${Math.round(p * 100)}<span>%</span></b></div></div><small class="d">${n}</small><em>${s}</em></div>`).join('')}</div>
  <div class="c"><h3 class="d">План на сегодня</h3><div class="x"><i style="background:#16ec06"></i><b>Силовая · тренировка A</b><span>${D.min} мин</span>${I('chev')}</div><div class="x"><i style="background:#0093e7"></i><b>Добрать белок</b><span>${D.protGoal - D.prot} г</span>${I('chev')}</div><div class="x"><i style="background:#ffde00"></i><b>Креатин</b><span>5 г</span>${I('chev')}</div></div>
  <div class="c"><h3 class="d">Тренировка A · ${D.n} упражнений</h3><div class="t d">${D.ex.slice(0, 5).map((e) => `<div>${e[0]}<span>${e[1]}×${e[2]} · ${kg(e[3])} кг</span></div>`).join('')}</div></div>
  <button class="go d">Начать тренировку</button></div>`],
];
const q = +new URLSearchParams(location.search).get('v');
if (q) document.body.classList.add('solo');
document.getElementById('wall').innerHTML = V.map(([name, note, html], i) => (q && q !== i + 1) ? '' :
  `<figure><figcaption><a href="?v=${i + 1}">${i + 1} · ${name}</a><span>${note}</span></figcaption><div class="phone v${i + 1}" data-n="${i + 1}" data-name="${name}"><div class="sb"><span>9:41</span><i></i></div><div class="scr">${html()}</div>${nav()}</div></figure>`).join('');
</script>
</body>
</html>

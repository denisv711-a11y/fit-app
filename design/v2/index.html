<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зал — 10 видов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;800;900&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
/* r41: 10 визуальных языков по донорам research/r41-visual/ДОНОРЫ.md. Данные одни (const D) — тестовые, веса новичка.
   ?v=N — один вариант на весь экран (для телефона), ?s=1|2 — какой экран. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--sys:-apple-system,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;--rnd:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
body{background:#202127;font:15px/1.3 var(--sys);color:#fff;-webkit-font-smoothing:antialiased}
.top{max-width:1200px;margin:0 auto;padding:28px 20px 6px;color:#c9ccd6}
.top h1{font-size:26px;color:#fff;margin-bottom:6px}.top p{font-size:14px;line-height:1.5}
.var{max-width:1240px;margin:26px auto 0;padding:0 16px}
.cap{display:flex;align-items:baseline;gap:12px;margin:0 6px 12px;flex-wrap:wrap}
.cap b{font-size:22px;color:#fff}.cap span{color:#9ea3b0;font-size:14px}.cap a{color:#8ab4ff;font-size:14px}
.row{display:flex;gap:22px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.don{flex:0 0 auto;width:260px}.don img{width:260px;border-radius:14px;display:block}.don div{font-size:12px;color:#9ea3b0;margin-top:6px;line-height:1.4}
.phone{flex:0 0 auto;width:390px;height:844px;position:relative;overflow:hidden;border-radius:44px;box-shadow:0 0 0 10px #000,0 0 0 11px #3a3b42,0 24px 60px rgba(0,0,0,.5);margin:11px;font-variant-numeric:tabular-nums}
.sb{position:absolute;top:0;left:0;right:0;height:50px;padding:17px 32px 0;font-weight:600;font-size:16px;display:flex;justify-content:space-between;z-index:5}
.sb i{width:25px;height:12px;border-radius:4px;border:1.5px solid currentColor;margin-top:4px;position:relative}.sb i::after{content:"";position:absolute;inset:1.5px;right:6px;background:currentColor;border-radius:1px}
.scr{position:absolute;top:50px;left:0;right:0;bottom:84px;overflow:hidden;padding:6px 18px 0}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;justify-content:space-around;padding-top:9px;font-size:10px;font-weight:500;z-index:5}
.tab div{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px}.tab svg{width:25px;height:25px}
.solo body,.solo{background:#000}
.solo .top,.solo .cap,.solo .don{display:none}.solo .var{margin:0;padding:0;max-width:none}.solo .row{display:block;padding:0;overflow:visible}
.solo .phone{margin:0 auto;box-shadow:none;border-radius:0;width:100vw;max-width:430px;height:100vh;min-height:700px}
svg text{font-family:inherit}

/* 1 Gentler Streak — светлый, пастель, скругления, зоны нагрузки */
.v1{background:#FDFCFD;color:#2b2731;font-family:var(--rnd)}
.v1 .sb{color:#2b2731}.v1 .tab{background:rgba(253,252,253,.94);border-top:1px solid #efe9f1;color:#a49dab}.v1 .tab .on{color:#F67E49}
.v1 h6{font-size:13px;color:#9b93a3;font-weight:600}.v1 h2{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:2px 0 12px}
.v1 .ball{height:164px;border-radius:26px;background:linear-gradient(135deg,#FDB00D,#F67E49);display:flex;align-items:center;gap:16px;padding:0 20px;color:#fff;margin-bottom:12px}
.v1 .ball .n{font-size:58px;font-weight:800;line-height:1}.v1 .ball small{display:block;font-size:15px;font-weight:600;opacity:.95}
.v1 .card{background:#F5F1F7;border-radius:22px;padding:14px 16px;margin-bottom:10px}
.v1 .zone{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,#c9e8f7 0 40%,#bdeed5 40% 80%,#fdd3c0 80%);margin:10px 0 6px}
.v1 .zone b{position:absolute;top:-5px;width:22px;height:22px;border-radius:50%;background:#29CB88;border:4px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.v1 .zl{display:flex;justify-content:space-between;font-size:11px;color:#9b93a3;font-weight:600}
.v1 .ex{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:20px;margin-bottom:7px;background:#F5F1F7}
.v1 .ex.d{background:#FFF1CF}.v1 .ex.now{background:#D5F4E5}
.v1 .ex i{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;color:#F67E49;flex:0 0 auto}
.v1 .ex.d i{background:#FDB00D;color:#fff}.v1 .ex.now i{background:#29CB88;color:#fff}
.v1 .ex b{font-size:15px;font-weight:700;display:block}.v1 .ex span{font-size:12.5px;color:#7d7585;font-weight:600}.v1 .ex em{margin-left:auto;font-style:normal;font-weight:800;font-size:15px}
.v1 .tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.v1 .tri div{border-radius:20px;padding:12px;font-size:12px;font-weight:700;color:#5d5565}.v1 .tri b{display:block;font-size:24px;color:#2b2731;margin:3px 0}
.v1 .mz{margin:9px 0 2px}.v1 .mz .t{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.v1 .mz .t span{color:#9b93a3;font-size:12.5px}
.v1 .mz .zone{height:9px;margin:6px 0 0}.v1 .mz .zone b{width:17px;height:17px;top:-4px;border-width:3px}

/* 2 Hevy — белый утилитарный лог */
.v2{background:#fff;color:#111;font-family:var(--sys)}
.v2 .sb{color:#111}.v2 .tab{background:#fff;border-top:1px solid #e9e9e9;color:#9a9a9a}.v2 .tab .on{color:#1D82EA}
.v2 .hd{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px;border-bottom:1px solid #eee;margin:0 -18px;padding-left:18px;padding-right:18px}
.v2 .hd b{font-size:17px}.v2 .btn{background:#1D82EA;color:#fff;border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px}
.v2 .stats{display:flex;gap:26px;padding:10px 0;font-size:12px;color:#8a8a8a;border-bottom:1px solid #eee;margin:0 -18px;padding-left:18px}.v2 .stats b{display:block;color:#111;font-size:15px;margin-top:1px}
.v2 .exh{display:flex;align-items:center;gap:10px;margin:14px 0 4px}.v2 .exh img{width:40px;height:40px;border-radius:50%;border:1px solid #eee;object-fit:cover;background:#fff}
.v2 .exh b{color:#1D82EA;font-size:16px}.v2 .note{font-size:13px;color:#8a8a8a;margin:2px 0 6px}
.v2 table{width:100%;border-collapse:collapse;font-size:15px;text-align:center}.v2 th{font-size:11.5px;color:#8a8a8a;font-weight:600;padding:6px 0}
.v2 td{padding:8px 0;font-weight:600}.v2 td.p{color:#9a9a9a;font-weight:500;font-size:14px}.v2 tr.ok td{background:#C7FEA1}
.v2 .ck{width:28px;height:28px;border-radius:7px;background:#ececec;display:inline-grid;place-items:center;color:#fff}.v2 tr.ok .ck{background:#4BC74B}
.v2 .add{background:#f2f2f2;border-radius:8px;text-align:center;padding:9px;font-weight:600;font-size:14px;margin:8px 0 6px}
.v2 .chips{display:flex;gap:6px;margin:10px 0}.v2 .chips span{border:1px solid #ddd;border-radius:16px;padding:6px 11px;font-size:13px;font-weight:600}.v2 .chips .on{background:#1D82EA;border-color:#1D82EA;color:#fff}
.v2 .pr{display:flex;align-items:center;gap:10px;background:#FFF7D1;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}.v2 .pr i{font-style:normal;font-size:22px}
.v2 .li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:15px}.v2 .li span{color:#8a8a8a}

/* 3 Whoop — графит, неоновые кольца */
.v3{background:#13181C;color:#fff;font-family:"Inter",var(--sys)}
.v3 .sb{color:#fff}.v3 .tab{background:#0d1114;color:#6b747b}.v3 .tab .on{color:#fff}
.v3 .ttl{text-align:center;font-size:12px;letter-spacing:2px;font-weight:600;color:#a0a8ae;margin:4px 0 12px}
.v3 .rings{display:flex;justify-content:space-between;margin-bottom:12px}.v3 .rings div{text-align:center;font-size:10.5px;letter-spacing:1.4px;font-weight:600;color:#a0a8ae}
.v3 .card{background:#23272B;border-radius:16px;padding:14px;margin-bottom:9px}
.v3 .cap2{font-size:10.5px;letter-spacing:1.6px;font-weight:600;color:#a0a8ae}
.v3 .big{font-size:40px;font-weight:600;letter-spacing:-1px}
.v3 .ex{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #2f3439;font-size:14px}.v3 .ex:last-child{border:0}
.v3 .ex b{font-weight:500;flex:1}.v3 .ex span{color:#a0a8ae;font-size:13px;margin-right:12px}.v3 .ex em{font-style:normal;font-weight:600;width:52px;text-align:right}
.v3 .dot{width:8px;height:8px;border-radius:50%;margin-right:10px;background:#3a4046}
.v3 .bars{display:flex;align-items:flex-end;justify-content:space-between;height:150px;position:relative;margin-top:10px}
.v3 .bars div{width:30px;border-radius:4px 4px 0 0;background:#0294E9;position:relative}.v3 .bars div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:#a0a8ae;white-space:nowrap}
.v3 .bars .band{width:auto;border-radius:0;position:absolute;left:0;right:0;background:rgba(26,238,8,.09);border-top:1px dashed rgba(26,238,8,.5);border-bottom:1px dashed rgba(26,238,8,.5)}

/* 4 Oura — спокойный, туман, тонкие цифры */
.v4{background:#19181D;color:#e9e7ef;font-family:"Inter",var(--sys)}
.v4 .sb{color:#fff}.v4 .tab{background:rgba(25,24,29,.82);backdrop-filter:blur(14px);color:#7b7884;border-top:1px solid #2a292f}.v4 .tab .on{color:#e9e7ef}
.v4 .fog{position:absolute;top:0;left:0;right:0;height:420px;background:radial-gradient(120% 70% at 30% 75%,#2C7393 0,rgba(44,115,147,.35) 38%,transparent 70%),radial-gradient(90% 50% at 85% 60%,#50B5EA55 0,transparent 60%),linear-gradient(#141318,#19181D);z-index:0}
.v4 .fog::after{content:"";position:absolute;left:0;right:0;bottom:60px;height:120px;background:linear-gradient(180deg,transparent,#19181D);}
.v4 .hills{position:absolute;left:0;right:0;top:250px;z-index:0;opacity:.55}
.v4 .scr{z-index:1}
.v4 .lb{font-size:13px;color:#a8a4b2;font-weight:400;letter-spacing:.3px}
.v4 .hero{font-size:92px;font-weight:200;letter-spacing:-4px;line-height:1;margin:8px 0 2px}
.v4 .card{background:#25262A;border-radius:20px;padding:15px 16px;margin-bottom:9px}
.v4 .ex{display:flex;justify-content:space-between;padding:9px 0;font-size:14.5px;font-weight:300;border-bottom:1px solid #303136}.v4 .ex:last-child{border:0}
.v4 .ex span{color:#a8a4b2}.v4 .gold{color:#AF9054}

/* 5 Ladder — чёрный, лайм, жирный капс */
.v5{background:#050505;color:#fff;font-family:"Inter",var(--sys)}
.v5 .sb{color:#fff}.v5 .tab{background:#050505;color:#666;border-top:1px solid #1d1d1d}.v5 .tab .on{color:#E4FC0C}
.v5 .A{font-family:"Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:.3px}
.v5 .hi{font-size:13px;color:#9a9a9a;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.v5 .ph{height:300px;border-radius:16px;position:relative;overflow:hidden;margin:10px 0 12px;background:#E4FC0C}
.v5 .ph img{position:absolute;right:-30px;bottom:0;height:290px;filter:grayscale(1) contrast(1.35);mix-blend-mode:multiply;opacity:.9}
.v5 .ph .t{position:absolute;left:16px;top:16px;color:#050505}.v5 .ph .t div:first-child{font-size:14px;font-weight:800;letter-spacing:1px}
.v5 .ph .t .A{font-size:52px;line-height:.95;margin-top:6px}
.v5 .ph .go{position:absolute;left:16px;bottom:16px;background:#050505;color:#E4FC0C;border-radius:30px;padding:12px 22px;font-weight:800;letter-spacing:1px;font-size:14px}
.v5 .wk{display:flex;justify-content:space-between;margin-bottom:12px}.v5 .wk div{text-align:center;font-size:11px;color:#8a8a8a;font-weight:700}
.v5 .wk i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1.5px solid #2a2a2a;margin-top:5px;font-style:normal;color:#fff;font-size:13px}
.v5 .wk i.d{background:#E4FC0C;border-color:#E4FC0C;color:#050505}.v5 .wk i.t{border-color:#E4FC0C;color:#E4FC0C}
.v5 .ex{display:flex;align-items:center;gap:12px;background:#171718;border-radius:14px;padding:10px 12px;margin-bottom:7px}
.v5 .ex .n{font-family:"Anton";font-size:22px;color:#E4FC0C;width:26px}.v5 .ex b{font-size:14.5px;display:block}.v5 .ex span{font-size:12.5px;color:#8a8a8a}
.v5 .lv{font-size:150px;line-height:.85;color:#E4FC0C}
.v5 .sbx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.v5 .sbx div{background:#171718;border-radius:14px;padding:12px}.v5 .sbx b{font-family:"Anton";font-size:34px;display:block;line-height:1.1}
.v5 .sbx span{font-size:11px;color:#8a8a8a;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.v5 .ml{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px;font-weight:600}.v5 .ml .bar{flex:1;height:8px;background:#222;border-radius:4px;overflow:hidden}.v5 .ml .bar i{display:block;height:100%;background:#E4FC0C}
.v5 .ml em{font-style:normal;font-family:"Anton";font-size:18px;width:48px;text-align:right}

/* 6 Finch — нарисованный мир, питомец */
.v6{background:linear-gradient(#9CDCFC,#C9EEFF 55%,#E9F8FF);color:#2d3a2f;font-family:"Nunito",var(--rnd)}
.v6 .sb{color:#1d3a4a}.v6 .tab{background:#fff;border-radius:26px 26px 0 0;color:#9bb0bd;box-shadow:0 -4px 18px rgba(30,90,130,.12)}.v6 .tab .on{color:#E56AA9}
.v6 .world{height:250px;position:relative;margin:0 -18px}
.v6 .bub{background:#FDFDFD;border-radius:24px;padding:13px 15px;margin-bottom:9px;box-shadow:0 4px 14px rgba(40,100,140,.12)}
.v6 .bub h3{font-weight:900;font-size:17px}.v6 .pill{display:inline-block;background:#ffe3f1;color:#c2468a;border-radius:20px;padding:3px 10px;font-weight:800;font-size:12px}
.v6 .chk{display:flex;align-items:center;gap:11px;padding:7px 0;font-weight:800;font-size:15px}.v6 .chk i{width:26px;height:26px;border-radius:50%;border:3px solid #cfe3cc;flex:0 0 auto}
.v6 .chk.d i{background:#79B458;border-color:#79B458;box-shadow:inset 0 0 0 3px #fff}.v6 .chk.d{color:#8a9a8c;text-decoration:line-through}.v6 .chk span{margin-left:auto;font-size:13px;color:#7a8d7d}
.v6 .chk.n i{border-color:#E56AA9}
.v6 .en{height:16px;border-radius:9px;background:#e8f4e4;overflow:hidden;margin:7px 0 3px}.v6 .en i{display:block;height:100%;background:linear-gradient(90deg,#79B458,#30843B);border-radius:9px}
.v6 .stick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.v6 .stick div{background:#fff;border-radius:18px;text-align:center;padding:8px 2px;font-weight:800;font-size:11px;border:2.5px solid #ffd3ea}
.v6 .stick b{display:block;font-size:20px;color:#E56AA9}

/* 7 (Not Boring) Habits — тактильный скевоморф, золото */
.v7{background:#1E1E1E;color:#f2f2f2;font-family:"Space Grotesk",var(--sys)}
.v7 .sb{color:#fff}.v7 .tab{background:#161616;color:#6b6b6b}.v7 .tab .on{color:#FEB933}
.v7 h2{font-size:30px;font-weight:700;letter-spacing:-.5px}.v7 .sub{color:#8f8f8f;font-size:14px;margin:2px 0 14px}
.v7 .k{display:flex;align-items:center;gap:14px;border-radius:20px;padding:13px 15px;margin-bottom:11px;background:linear-gradient(#2e2e2e,#262626);box-shadow:0 6px 0 #0e0e0e,inset 0 1px 0 rgba(255,255,255,.08)}
.v7 .k .c{width:40px;height:40px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,#3c3c3c,#151515);box-shadow:inset 0 2px 5px #000,0 1px 0 rgba(255,255,255,.1)}
.v7 .k.d{background:linear-gradient(#FFC94D,#F0A61C);color:#2a1a00;box-shadow:0 6px 0 #9a6200,inset 0 1px 0 rgba(255,255,255,.6)}
.v7 .k.d .c{background:radial-gradient(circle at 35% 30%,#fff7e0,#f3cd73);box-shadow:inset 0 -2px 3px rgba(150,90,0,.45),0 2px 3px rgba(0,0,0,.25);display:grid;place-items:center;font-weight:700}
.v7 .k b{font-size:16px;display:block}.v7 .k span{font-size:12.5px;opacity:.7}
.v7 .k.now{outline:2px solid #FEB933;outline-offset:2px}
.v7 .yr{display:flex;gap:3px;align-items:flex-end;height:64px;margin:10px 0 4px}.v7 .yr i{flex:1;border-radius:2px;background:#2d2d2d;height:100%}.v7 .yr i.f{background:#FEB933}.v7 .yr i.h{background:#8a6420}
.v7 .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8f8f8f;display:flex;justify-content:space-between}

/* 8 Zero — красный экран, белые карточки, огромное кольцо */
.v8{background:#FB3927;color:#fff;font-family:var(--rnd)}
.v8 .sb{color:#fff}.v8 .tab{background:#fff;color:#a7a7a7}.v8 .tab .on{color:#FB3927}
.v8 .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:19px;margin:4px 0 6px}.v8 .hd span{background:rgba(255,255,255,.22);border-radius:16px;padding:5px 11px;font-size:13px}
.v8 .ring{display:grid;place-items:center;margin:2px 0 8px;position:relative}
.v8 .ring .in{position:absolute;text-align:center}.v8 .ring .t{font-size:58px;font-weight:800;letter-spacing:-1px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.v8 .wc{background:#fff;color:#1d1d1d;border-radius:20px;padding:14px 16px;margin-bottom:9px;box-shadow:0 4px 14px rgba(120,0,0,.18)}
.v8 .wc .l{font-size:12.5px;color:#8a8a8a;font-weight:700}.v8 .wc b{font-size:19px;font-weight:800}
.v8 .sets{display:flex;gap:7px;margin-top:10px}.v8 .sets i{flex:1;height:38px;border-radius:12px;background:#f2f2f2;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;color:#9a9a9a}
.v8 .sets i.d{background:#0D892C;color:#fff}.v8 .sets i.n{background:#fff;border:2.5px solid #FB3927;color:#FB3927}
.v8 .st{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f0f0f0;font-weight:700;font-size:14.5px}.v8 .st:last-child{border:0}
.v8 .st i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;background:#f2f2f2;color:#9a9a9a}.v8 .st.d i{background:#0D892C;color:#fff}.v8 .st.n i{background:#FB3927;color:#fff}
.v8 .st span{margin-left:auto;color:#8a8a8a;font-size:13px}

/* 9 Structured — светлая лента дня */
.v9{background:#F9F9FB;color:#1e2633;font-family:var(--rnd)}
.v9 .sb{color:#1e2633}.v9 .tab{background:#fff;border-top:1px solid #ececf0;color:#a3a7b1}.v9 .tab .on{color:#A54A6E}
.v9 .days{display:flex;justify-content:space-between;margin:2px 0 14px}.v9 .days div{text-align:center;font-size:11px;color:#8b909b;font-weight:600;width:44px}
.v9 .days b{display:grid;place-items:center;height:36px;border-radius:12px;font-size:16px;color:#1e2633;margin-top:4px}.v9 .days .on b{background:#1e2633;color:#fff}
.v9 h2{font-size:27px;font-weight:800;margin-bottom:12px}.v9 h2 span{color:#A54A6E}
.v9 .tl{position:relative;padding-left:0}
.v9 .it{display:flex;align-items:center;gap:12px;margin-bottom:9px;position:relative}
.v9 .tm{width:40px;font-size:12px;color:#8b909b;font-weight:600;text-align:right}
.v9 .ic{width:46px;height:58px;border-radius:23px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:0 0 auto;position:relative;z-index:1}
.v9 .ic.sm{height:46px}

function ring(p, size, w, col, track, inner = '') {
  const r = (size - w) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${w}"/>
  <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c * p / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>${inner}</svg>`;
}
function line(vals, w, h, col, fill, dots = true, labels) {
  const mn = Math.min(...vals) - 2, mx = Math.max(...vals) + 1, X = (i) => 8 + i * (w - 16) / (vals.length - 1), Y = (v) => h - 18 - (v - mn) / (mx - mn) * (h - 34);
  const d = vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const area = fill ? `<path d="${d} L${X(vals.length - 1)} ${h - 18} L8 ${h - 18} Z" fill="${fill}"/>` : '';
  const pts = dots ? vals.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === vals.length - 1 ? 4.5 : 3}" fill="${col}"/>`).join('') : '';
  const lb = labels ? labels.map((l, i) => (i % 2 === 0 || i === labels.length - 1) ? `<text x="${X(i)}" y="${h - 3}" font-size="10" text-anchor="middle" fill="${labels.c || '#999'}">${l}</text>` : '').join('') : '';
  return `<svg width="${w}" height="${h}">${area}<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts}${lb}</svg>`;
}
